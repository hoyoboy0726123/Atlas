    ```python
    import os, re
    p = 'ai_output/presentation_outline.md'
    assert os.path.exists(p)
    txt = open(p, encoding='utf-8').read()
    for sect in ['封面', 'Agenda', '結論']:
        assert sect in txt, f'缺 {sect}'
    # 每頁 bullet ≤ 5
    pages = re.split(r'^##\s', txt, flags=re.M)
    for page in pages:
        bullets = re.findall(r'^[-*]\s', page, flags=re.M)
        assert len(bullets) <= 5, f'某頁 bullet >5: {len(bullets)}'
    print('OK')
    ```
