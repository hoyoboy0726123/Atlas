    ## 文獻類型 + 證據等級
    ## 發表期刊 + 年份
    ## PICO
    ## 主要結論
    ## limitation
    ## 適用範圍
    ## 利益衝突聲明
    ---
    本摘要為文獻結構化整理、非醫療建議。任何診斷、用藥、停藥、療程調整決策、請務必諮詢您的主治醫師或藥師。
