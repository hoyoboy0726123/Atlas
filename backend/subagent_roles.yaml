    1. 讀上游資料(**全部讀完**:research_notes / 多個來源檔都要讀進來、不要只讀第一個就寫)
    2. 識別報告類型 + 對應字數下限:
       - 日報 800-1500 / 週報 1500-3000 / 月報 3000-5000
