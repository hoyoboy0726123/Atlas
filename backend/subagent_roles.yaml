       - default → 預設(❌默認 / 缺省)
       - information → 資訊 / 訊息(❌信息)
       - smartphone → 智慧型手機(❌智能手機)
       - file → 檔案(❌文件 / 文檔)
       - online → 線上(❌在線)
       - network → 網路(❌網絡)
       - server → 伺服器(❌服務器)
