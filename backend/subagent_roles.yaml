    ```python
    import os, re, json
    src_p = './inputs/source.md'
    out_p = './outputs/translated.md'
    assert os.path.exists(out_p)
    src = open(src_p, encoding='utf-8').read()
    out = open(out_p, encoding='utf-8').read()
    if src_p.endswith('.md'):
        src_h = len(re.findall(r'^#+\s', src, re.M))
        out_h = len(re.findall(r'^#+\s', out, re.M))
        assert src_h == out_h, f'標題數不一致:{src_h} vs {out_h}'
    if src_p.endswith('.json'):
        s = json.loads(src); o = json.loads(out)
        assert sorted(s.keys()) == sorted(o.keys()), 'JSON keys 不一致'
    bad = ['視頻','激活','默認','質量','信息','軟件','屏幕','智能手機','文檔','在線','網絡','服務器','缺省']
    found = [w for w in bad if w in out]
    assert not found, f'對岸詞:{found}'
    print('PASS')
    ```
    跑過 PASS 才能 done。

proofreader:
  description: 校對(錯字 / 語病 / 標點 / 一致性)、輸出修改建議 diff
  label: 校對師
  tools:
