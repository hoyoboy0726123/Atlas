[project]
name = "atlas-backend"
version = "1.0.0"
description = "Atlas — 用白話描述、由 AI 產生並執行的工作流自動化平台(後端)"
readme = "../README.md"
license = { text = "MIT" }
# pydantic 2.9.2 沒有 Python 3.14 的 wheel(會退回從原始碼編譯而失敗)
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "pyperclip>=1.8",
    "jinja2>=3.1.0",
    "langchain-core",
    "langchain-groq",
    "langchain-google-genai",
    "google-genai",
    "langchain-ollama>=0.3.0",
    "langchain-openai",
    "langchain-anthropic",
    "apscheduler==3.10.4",
    "sqlalchemy==2.0.36",
    "python-telegram-bot==21.6",
    "aiofiles==24.1.0",
    "openpyxl",
    "python-multipart",
    "pandas",
    "python-docx",
    "python-pptx",
    "Pillow",
    "matplotlib",
    "pypdfium2",
    "pyautogui",
    "pynput",
    "mss",
    "opencv-python",
    "numpy",
    "uiautomation; sys_platform == 'win32'",
    "httpx",
    "trafilatura",
    "markdownify",
    "rapidocr==3.9.2",
    "onnxruntime",
    "opencc-python-reimplemented",
    "fastembed",
    "mcp",
    "starlette>=0.37.2,<0.39.0",
    "jsonschema>=4.0.0",
]

[tool.uv]
# 這是應用程式、不是要發佈的套件:uv sync 只裝依賴,不打包本專案
package = false
